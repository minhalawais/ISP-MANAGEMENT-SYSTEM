      <stop offset="0%" stop-color="#0B3D4A"/>
      <stop offset="45%" stop-color="#0F6E5C"/>
      <stop offset="100%" stop-color="#102A32"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#7FF0AE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7FF0AE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8FFF4"/>
      <stop offset="70%" stop-color="#7FF0AE"/>
      <stop offset="100%" stop-color="#7FF0AE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="1180" cy="220" rx="420" ry="260" fill="url(#glow)"/>
