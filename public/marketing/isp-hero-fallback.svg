  <!-- network arcs -->
  <path d="M180 560 C420 200, 780 180, 1180 300" stroke="#7FF0AE" stroke-opacity="0.35" stroke-width="2" fill="none"/>
  <path d="M260 600 C520 280, 900 220, 1320 340" stroke="#9BE7FF" stroke-opacity="0.25" stroke-width="2" fill="none"/>
  <path d="M120 640 C480 360, 860 300, 1400 420" stroke="#7FF0AE" stroke-opacity="0.18" stroke-width="2" fill="none"/>
  <!-- nodes -->
  <circle cx="420" cy="360" r="8" fill="url(#node)"/>
  <circle cx="780" cy="260" r="10" fill="url(#node)"/>
  <circle cx="1100" cy="310" r="9" fill="url(#node)"/>
  <circle cx="1320" cy="340" r="7" fill="url(#node)"/>
