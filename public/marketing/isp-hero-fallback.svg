  <path d="M0 620 H1600 V900 H0 Z" fill="#0A1C22" opacity="0.55"/>
  <path d="M80 620 V480 H140 V620 H200 V420 H280 V620 H340 V500 H420 V620 H500 V380 H600 V620 H680 V460 H760 V620 H860 V400 H960 V620 H1040 V440 H1140 V620 H1220 V360 H1320 V620 H1400 V480 H1520 V620" fill="#0E2830"/>
