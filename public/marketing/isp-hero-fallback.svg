  <circle cx="1120" cy="564" r="8" fill="#7FF0AE"/>
  <circle cx="1150" cy="564" r="8" fill="#9BE7FF"/>
  <circle cx="1180" cy="564" r="8" fill="#7FF0AE" opacity="0.6"/>
